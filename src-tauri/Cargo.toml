[package]
name = "tomato-clock"
version = "1.0.0"
description = "A Pomodoro timer with bird animation"
authors = ["ILTomatoes"]
edition = "2021"

[lib]
name = "tomato_clock_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
